[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ipykeep"
version = "0.1.0.dev0"
description = "Persistent, stateful Jupyter kernel access for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Chengxuan Li", email = "Lichengxuan@outlook.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["jupyter", "kernel", "mcp", "ai-agents", "notebook", "ipyflow", "staleness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: Jupyter",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ipyflow>=0.0.200",
    "jupyter_client>=8",
    "ipykernel>=6",
    "nbformat>=5",
    "watchfiles>=0.20",
    "typer>=0.9",
]

[project.optional-dependencies]
# Built-in DataFrame / ndarray summarizers
inspect = ["pandas", "numpy"]
# `ipykeep start --serve`: host the kernel in a server so IDEs can attach.
# jupyterlab also provides the Notebook 7 UI; jupyter_server alone suffices for VS Code.
serve = ["jupyterlab"]
# MCP server: `ipykeep mcp-serve` (pip install "ipykeep[mcp]")
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/Chengxuan-Li/ipykeep"
Repository = "https://github.com/Chengxuan-Li/ipykeep"
Issues = "https://github.com/Chengxuan-Li/ipykeep/issues"

[project.scripts]
ipykeep = "ipykeep.cli:app"

[tool.setuptools.packages.find]
include = ["ipykeep*"]

[tool.setuptools.package-data]
ipykeep = ["py.typed"]
