[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ipykeep"
version = "0.1.0.dev0"
description = "Persistent, stateful Jupyter kernel access for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipyflow>=0.0.200",
    "jupyter_client>=8",
    "ipykernel>=6",
    "nbformat>=5",
    "watchfiles>=0.20",
    "typer>=0.9",
]

[project.optional-dependencies]
# Built-in DataFrame / ndarray summarizers
inspect = ["pandas", "numpy"]
# `ipykeep start --serve`: host the kernel in a server so IDEs can attach.
# jupyterlab also provides the Notebook 7 UI; jupyter_server alone suffices for VS Code.
serve = ["jupyterlab"]
# Planned MCP server (Phase 4)
mcp = ["mcp>=1.0"]

[project.scripts]
ipykeep = "ipykeep.cli:app"

[tool.setuptools.packages.find]
include = ["ipykeep*"]

[tool.setuptools.package-data]
ipykeep = ["py.typed"]
